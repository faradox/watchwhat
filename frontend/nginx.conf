server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # The API, so a standalone install needs only this one port. A host proxy
    # that does the login may send /api straight to the backend instead, and
    # then this block is not used. Resolved per request: nginx starts even when
    # the backend container is not up yet.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend http://watchwhat-backend:8000;
        proxy_pass $backend;
        # With the port: the backend compares it with the Origin of writes.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Only a login proxy in front may vouch for a user.
        proxy_set_header Remote-User "";
        proxy_set_header X-Proxy-Secret "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ \.html$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
